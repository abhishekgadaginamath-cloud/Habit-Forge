kind = "web"
previewPath = "/"
title = "HabitForge"
version = "1.0.0"
id = "artifacts/habitforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23548

[services.development]
run = "pnpm --filter @workspace/habitforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habitforge", "run", "build" ]
publicDir = "artifacts/habitforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23548"
BASE_PATH = "/"
